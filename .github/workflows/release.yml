name: Build & release

# Every push to main (or a manual run from the Actions tab) builds the Windows
# installer and publishes it as release v<version>, the version being the one in
# src-tauri/tauri.conf.json. Bump that to cut a new release; pushes without a bump
# refresh the current one.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - run: npm ci

      - run: npx tauri build

      - name: Collect installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName "out/$($exe.Name)"
          # Fixed name so releases/latest/download/Notch-setup.exe always works
          Copy-Item $exe.FullName out/Notch-setup.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Notch ${{ steps.ver.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: out/*.exe
